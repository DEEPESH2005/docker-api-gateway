services:

  backend:
    build:
      context: .
      dockerfile: dockerfile.backend

    container_name: backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    networks:
      - ares-network


  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend

    container_name: frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app

    environment:
      BACKEND_URL: http://backend:8000/api

    depends_on:
      - backend

    networks:
      - ares-network


networks:
  ares-network:
    driver: bridge